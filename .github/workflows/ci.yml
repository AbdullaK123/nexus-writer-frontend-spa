name: Nexus Writer Frontend CI
on:
    pull_request:
        branches: ["main"]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
           - name: Checkout the code
             uses: actions/checkout@v4
           - name: Install node js
             uses: actions/setup-node@v4
             with:
                node-version: 24
                cache: npm
           - name: Install dependancies
             run: npm ci
           - name: Typecheck
             run: npx tsc -b
           - name: Lint
             run: npm run lint
           - name: Run tests
             run: npm test